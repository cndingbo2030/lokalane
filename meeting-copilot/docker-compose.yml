# One-command deployment with automatic HTTPS:
#   1. point a DNS record for DOMAIN at this machine (ports 80 and 443 open)
#   2. cp .env.example .env, fill in DOMAIN, ACCESS_TOKEN and the API keys
#   3. docker compose up -d --build
services:
  copilot:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      # Caddy sits in front: take the client address from X-Forwarded-For (rate limits).
      TRUST_PROXY: "true"
      # The bot service streams meeting audio back to wss://DOMAIN/ws/bot.
      PUBLIC_URL: https://${DOMAIN:?set DOMAIN in .env}
    expose:
      - "8790"
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - copilot
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
